# ============================
# Prefix key: Ctrl+Space
# ============================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ============================
# Mouse support
# ============================
set -g mouse on

# ============================
# Window/pane numbering starts at 1
# ============================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ============================
# New window with prefix + c
# ============================
bind c new-window

# ============================
# Navigate windows with Shift+Left/Right (no prefix needed)
# ============================
bind -n S-Left previous-window
bind -n S-Right next-window

# ============================
# Splits
# ============================
bind % split-window -h   # prefix + % → vertical split (side by side)
bind : split-window -v   # prefix + : → horizontal split (stacked)

# ============================
# Vi mode + copy/paste between windows
# ============================
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind ] paste-buffer

# ============================
# Quality of life
# ============================
set -g history-limit 10000
set -sg escape-time 0
set -g default-terminal "screen-256color"
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
